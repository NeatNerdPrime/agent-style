name: Publish

# Fires on the human gate (clicking "Publish release" in the UI or running
# `gh release create v<X.Y.Z>`). Validation is a prerequisite, not enforced
# here: the operator must confirm the validate workflow is green for the
# release commit before creating the release. PyPI and npm are immutable once
# published. publish.yml builds and uploads the release artifacts.
#
# PyPI: uses Trusted Publishing (OIDC) - no secret in the repo. A pending
# publisher must be configured at https://pypi.org/manage/account/publishing/
# before the first release fires the workflow.
#
# npm: uses Trusted Publishing (OIDC) - no secret in the repo. A Trusted
# Publisher (owner/repo/workflow) must be configured at
# https://www.npmjs.com/package/agent-style/access before the first release
# fires. OIDC publishes are exempt from the package's 2FA-on-publish policy
# that blocks plain automation tokens (E403). npm >= 11.5.1 and Node >= 22.14
# are required for OIDC, so the job runs on Node 24 and upgrades npm.
# --provenance attaches a signed build-provenance statement.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      # Required: without a tag there is nothing to check the package version
      # against, and the checkout would fall back to whatever the selected
      # branch points at, which is how a manual dispatch could publish an
      # arbitrary tree past the gate.
      tag:
        description: "Existing release tag to build and publish"
        required: true
        type: string
      npm_only:
        description: "Skip PyPI; publish npm only (use when PyPI is already at this version)"
        type: boolean
        default: false

jobs:
  # Fail closed before either registry is touched. Without this, a forgotten
  # version bump surfaces as a confusing npm duplicate-version error after the
  # PyPI job has already reported success, because skip-existing swallows the
  # duplicate on that side. Nothing anywhere says the tag disagreed with the
  # packages, so the one mistake with no mechanical signal is diagnosed by
  # hand, from the wrong job, after a partial run.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # Build from the tagged commit, not from whatever the default branch
          # points at when the release is published.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Assert the five version-carrying files agree, and match the tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          pyproject="$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/pypi/pyproject.toml | head -1)"
          initpy="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' packages/pypi/agent_style/__init__.py | head -1)"
          pkgjson="$(node -p "require('./packages/npm/package.json').version")"
          pytools="$(node -p "require('./packages/pypi/agent_style/data/tools.json').agent_style_version")"
          npmtools="$(node -p "require('./packages/npm/data/tools.json').agent_style_version")"
          echo "pyproject=$pyproject init=$initpy package.json=$pkgjson pypi-tools=$pytools npm-tools=$npmtools"
          for v in "$initpy" "$pkgjson" "$pytools" "$npmtools"; do
            if [ "$v" != "$pyproject" ]; then
              echo "::error::version files disagree; refusing to publish" >&2
              exit 1
            fi
          done
          if [ -z "${TAG_NAME:-}" ]; then
            echo "::error::no release tag supplied; refusing to publish" >&2
            exit 1
          fi
          if [ "$TAG_NAME" != "v$pyproject" ]; then
            echo "::error::tag $TAG_NAME does not match package version $pyproject" >&2
            exit 1
          fi
          echo "tag $TAG_NAME matches all five version files"

  pypi:
    needs: gate
    if: github.event_name == 'release' || inputs.npm_only != true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build packages/pypi --outdir dist
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  npm:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # npm Trusted Publishing (OIDC) needs npm >= 11.5.1 and Node >= 22.14.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      # No NODE_AUTH_TOKEN: with a configured Trusted Publisher on npm and
      # id-token: write, npm authenticates via OIDC. --provenance is implied by
      # trusted publishing but kept explicit for clarity.
      - name: Publish to npm via OIDC trusted publishing
        working-directory: packages/npm
        run: npm publish --provenance --access public
